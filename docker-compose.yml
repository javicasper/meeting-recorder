services:
  app:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8787
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./package.json:/app/package.json
    restart: unless-stopped

  api:
    build: .
    command: npm run api
    env_file: .env
    volumes:
      - ./server:/app/server
      - ./src/lib:/app/src/lib
      - ./package.json:/app/package.json
    restart: unless-stopped
