[package]
name = "grabador-reuniones"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
rusqlite = "0.37"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
