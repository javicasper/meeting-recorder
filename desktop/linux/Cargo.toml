[package]
name = "grabador-reuniones"
version = "0.3.0"
edition = "2021"
description = "Graba reuniones, las transcribe y levanta acta (Traventia)"
license = "UNLICENSED"

[package.metadata.deb]
maintainer = "Traventia"
section = "utils"
depends = "libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.5), ffmpeg, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good"
assets = [
  ["target/release/grabador-reuniones", "usr/bin/", "755"],
  ["packaging/com.traventia.meeting-recorder.desktop", "usr/share/applications/", "644"],
  ["packaging/com.traventia.meeting-recorder.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
rusqlite = "0.37"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
